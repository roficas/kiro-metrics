name: Update Attribution Log

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-attribution-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history and notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch attribution notes
        run: |
          git fetch origin refs/notes/ai-attribution:refs/notes/ai-attribution 2>/dev/null || echo "No attribution notes ref found"

      - name: Extract attribution from new commits
        run: |
          mkdir -p metrics

          # Get commits in this push that have ai-authored-by trailer
          # Use GITHUB_SHA for the head and compare against what's already logged
          LAST_LOGGED=""
          if [ -f metrics/attribution-log.jsonl ]; then
            LAST_LOGGED=$(tail -1 metrics/attribution-log.jsonl | jq -r '.sha // empty' 2>/dev/null || echo "")
          fi

          # Get all commits on main with attribution trailers
          if [ -n "$LAST_LOGGED" ]; then
            RANGE="${LAST_LOGGED}..HEAD"
          else
            RANGE="HEAD"
          fi

          git log $RANGE --format='%H' --reverse 2>/dev/null | while read -r SHA; do
            # Skip if already logged
            if [ -f metrics/attribution-log.jsonl ] && grep -q "\"sha\":\"${SHA}\"" metrics/attribution-log.jsonl 2>/dev/null; then
              continue
            fi

            # Get commit metadata
            AUTHOR=$(git log -1 --format='%an' "$SHA")
            EMAIL=$(git log -1 --format='%ae' "$SHA")
            DATE=$(git log -1 --format='%aI' "$SHA")
            MESSAGE=$(git log -1 --format='%s' "$SHA")
            FULL_MSG=$(git log -1 --format='%B' "$SHA")

            # Parse trailers
            AI_AUTHORED_BY=$(echo "$FULL_MSG" | grep -m1 '^ai-authored-by:' | sed 's/^ai-authored-by:\s*//' || echo "")
            AI_AUTHORSHIP=$(echo "$FULL_MSG" | grep -m1 '^ai-authorship:' | sed 's/^ai-authorship:\s*//' || echo "")
            AI_LINES=$(echo "$FULL_MSG" | grep -m1 '^ai-lines:' | sed 's/^ai-lines:\s*//' || echo "0")
            HUMAN_LINES=$(echo "$FULL_MSG" | grep -m1 '^human-lines:' | sed 's/^human-lines:\s*//' || echo "0")

            # Try to read git notes
            NOTES=$(git notes --ref=ai-attribution show "$SHA" 2>/dev/null || echo "null")
            if [ "$NOTES" = "null" ] || [ -z "$NOTES" ]; then
              NOTES="null"
            fi

            # Build JSON entry
            jq -n -c \
              --arg sha "$SHA" \
              --arg author "$AUTHOR" \
              --arg email "$EMAIL" \
              --arg date "$DATE" \
              --arg message "$MESSAGE" \
              --arg ai_authored_by "$AI_AUTHORED_BY" \
              --arg ai_authorship "$AI_AUTHORSHIP" \
              --argjson ai_lines "${AI_LINES:-0}" \
              --argjson human_lines "${HUMAN_LINES:-0}" \
              --argjson notes "$NOTES" \
              '{
                sha: $sha,
                author: $author,
                email: $email,
                date: $date,
                message: $message,
                trailers: {
                  ai_authored_by: (if $ai_authored_by == "" then null else $ai_authored_by end),
                  ai_authorship: (if $ai_authorship == "" then null else $ai_authorship end),
                  ai_lines: $ai_lines,
                  human_lines: $human_lines
                },
                notes: $notes
              }' >> metrics/attribution-log.jsonl
          done

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/attribution-log.jsonl
          if git diff --cached --quiet; then
            echo "No new attribution entries to log"
          else
            ENTRIES=$(wc -l < metrics/attribution-log.jsonl | tr -d ' ')
            git commit -m "chore(metrics): update attribution log (${ENTRIES} entries)

ai-authorship: human-only
ai-lines: 0
human-lines: 0"
            git push
          fi
