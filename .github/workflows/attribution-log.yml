name: Update Attribution Log

# Keeps metrics/attribution-log.jsonl current so the CLI's GitHub connector can read
# attribution over the API, which cannot see git notes.
#
# This job calls scripts/backfill-attribution-log.sh — the same script the GitLab
# pipeline and local runs use. It previously reimplemented trailer and notes extraction
# inline, which caused three defects the shared script does not have:
#
#   1. It was incremental (LAST_LOGGED..HEAD, skipping SHAs already present), so an
#      entry written before refs/notes/ai-attribution was pushed kept `notes: null`
#      forever — the run would never revisit it. Since file-level attribution lives only
#      in the notes, byFile and the top-AI-files report sections stayed empty. The
#      shared script rebuilds from full history, so it is self-healing.
#   2. Trailer values were interpolated straight into JSON via --argjson. One malformed
#      trailer emitted an invalid line and corrupted the log. The script validates.
#   3. `ai-attribution: unknown` was not captured at all, making an unmeasurable commit
#      indistinguishable from a genuinely human-only one.
#
# Tradeoff: a full rebuild is O(total history) per run rather than O(new commits). On
# repositories with very large histories, prefer running this on a schedule instead of
# every push, or reintroduce an incremental fast path that falls back to a full rebuild
# whenever any entry still has notes: null.
#
# No loop guard is needed here. GitHub does not trigger workflows from pushes made with
# the default GITHUB_TOKEN, so the commit below cannot retrigger this job. The GitLab
# equivalent needs [skip ci] and a workflow rule precisely because it has no such
# protection.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-attribution-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        # Pinned to a commit rather than a mutable tag: this job holds contents: write, so a
        # compromised tag would be able to push to main. Update the SHA deliberately.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The rebuild walks every commit; a shallow clone would silently truncate the log.
          fetch-depth: 0

      - name: Fetch attribution notes
        run: |
          git fetch origin refs/notes/ai-attribution:refs/notes/ai-attribution 2>/dev/null \
            || echo "No refs/notes/ai-attribution on origin — entries will have notes: null."

      - name: Rebuild attribution log
        run: |
          set -eu

          if [ ! -x scripts/backfill-attribution-log.sh ]; then
            echo "scripts/backfill-attribution-log.sh is missing or not executable." >&2
            exit 1
          fi

          BEFORE=0
          [ -f metrics/attribution-log.jsonl ] && BEFORE=$(wc -l < metrics/attribution-log.jsonl | tr -d ' ')

          bash scripts/backfill-attribution-log.sh

          AFTER=$(wc -l < metrics/attribution-log.jsonl | tr -d ' ')
          echo "attribution log: ${BEFORE} -> ${AFTER} entries"

      - name: Commit updated log
        run: |
          set -eu

          if git diff --quiet -- metrics/attribution-log.jsonl; then
            echo "No attribution changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/attribution-log.jsonl

          ENTRIES=$(wc -l < metrics/attribution-log.jsonl | tr -d ' ')

          # Deliberately emits no ai-* trailers. The previous version stamped
          # `ai-authorship: human-only / ai-lines: 0 / human-lines: 0` on its own commit,
          # asserting that a machine wrote it by hand. Consumers should exclude bot
          # commits from rates rather than be told a falsehood about them.
          git commit -m "chore(metrics): update attribution log (${ENTRIES} entries)"
          git push
